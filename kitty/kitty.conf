# === Font ===
font_family      Hack
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        12.0
symbol_map U+e000-U+f8ff,U+e0a0-U+e0d4,U+e300-U+e3eb,U+f000-U+f2e0,U+f0001-U+f1af0 Symbols Nerd Font Mono

background_opacity         0.7
background_blur            1

# === Behavior ===
cursor_shape       beam
cursor_blink_interval 0
scrollback_lines    10000
confirm_os_window_close 0
enable_audio_bell    no
cursor_trail 3
cursor_trail_decay 0.1 0.4

# === Window / tab layout ===
window_padding_width 6
tab_bar_edge      top
tab_bar_style     powerline
tab_powerline_style slanted
tab_title_template "{title}"

# === Theme: Rose Pine, background matched to KDE Breeze Dark (Colors:View) ===
foreground              #e0def4
background              #141618
selection_foreground    #e0def4
selection_background    #403d52

cursor                  #524f67
cursor_text_color       #e0def4

url_color               #c4a7e7

active_tab_foreground   #e0def4
active_tab_background   #26233a
inactive_tab_foreground #6e6a86
inactive_tab_background #141618

active_border_color     #c4a7e7
inactive_border_color   #403d52

